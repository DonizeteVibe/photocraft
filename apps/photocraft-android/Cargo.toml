[package]
name = "photocraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "photocraft_android"
crate-type = ["cdylib"]

# Keep unsafe code denied in this crate, but allow the one ABI annotation on android_main.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
egui = { workspace = true }
egui-wgpu = { workspace = true }
log = { workspace = true }
photocraft-engine = { workspace = true }
photocraft-io = { workspace = true }
photocraft-ui-egui = { workspace = true, default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
android_logger = "0.15"
ndk = { version = "0.9", features = ["rwh_06"] }
pollster = "0.4"
raw-window-handle = "0.6"
